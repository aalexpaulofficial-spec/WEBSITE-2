<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Jumping</title>
    <meta name="description" content="An immersive space portal landing experience exploring Mars, Earth, and Venus." />
    <meta property="og:title" content="Planet Jumping" />
    <meta property="og:description" content="An immersive space portal landing experience exploring Mars, Earth, and Venus." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @font-face {
        font-family: 'SF Pro';
        font-weight: 400;
        src: local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular'), local('Helvetica Neue'), local('Arial');
      }
      @font-face {
        font-family: 'SF Pro';
        font-weight: 700;
        src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold');
      }
      @font-face {
        font-family: 'SF Pro Thin';
        font-weight: 100;
        src: local('SF Pro Text Thin'), local('SF Pro Thin'), local('SFProText-Thin');
      }
      @font-face {
        font-family: 'Aalto';
        font-weight: 400;
        src: local('Aalto'), local('Arial Narrow Bold'), local('Arial Narrow'), local('Impact');
      }

      :root {
        font-family: 'SF Pro', Arial, sans-serif;
        color: #fff;
        background: #090807;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090807;
        color: #fff;
      }
      .experience {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 540px;
        overflow: hidden;
        background: #0a0908;
      }
      .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .background {
        object-fit: cover;
        opacity: 0;
        transition: opacity .8s ease;
      }
      .background.is-visible {
        opacity: 1;
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%);
        pointer-events: none;
      }
      .chrome {
        position: absolute;
        z-index: 4;
        transition: opacity .45s ease, filter .45s ease;
      }
      .experience.is-transitioning .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }

      /* HEADER */
      .header {
        left: clamp(18px, 1.95vw, 28px);
        right: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav {
        display: flex;
        align-items: center;
        height: 42px;
        padding: 4px 5px;
        border: 1px solid rgba(255, 255, 255, .45);
        background: rgba(255, 255, 255, .1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 999px;
      }
      .nav a {
        color: #fff;
        text-decoration: none;
        padding: 8px 19px;
        border-radius: 999px;
        line-height: 1;
        font-size: 15px;
        transition: background-color .2s, color .2s;
      }
      .nav a.active {
        background: #fff;
        color: #000;
      }
      .menu {
        height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        cursor: pointer;
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        transition: opacity .2s, transform .2s;
      }
      .menu:hover {
        opacity: 0.9;
      }
      .menu:active {
        transform: scale(0.97);
      }

      /* SIDEBAR */
      .planet-list {
        left: clamp(18px, 1.95vw, 28px);
        top: 50%;
        transform: translateY(-43%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
        user-select: none;
      }
      .planet-item {
        display: flex;
        align-items: center;
        min-height: 20px;
        color: #fff;
      }
      .planet-item.active {
        font-size: 18px;
        font-weight: 700;
        gap: 8px;
      }
      .planet-item.active:before {
        content: '';
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        display: inline-block;
        flex-shrink: 0;
      }

      /* PORTAL */
      .portal-wrap {
        left: 50%;
        top: 50%;
        width: min(320px, 31vw);
        transform: translate(-50%, -54%);
        perspective: none;
      }
      .portal-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 16px;
        opacity: 0;
      }
      .portal-heading strong {
        font-size: 18px;
        margin-left: 8px;
      }
      .portal {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 320/350;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 90px;
        background: transparent;
        cursor: pointer;
        box-shadow: none;
        transform: none !important;
        outline: none;
      }
      .portal video, .portal img {
        visibility: hidden;
        position: absolute;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .portal-canvas {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* CONTENT */
      .planet-content {
        left: clamp(28px, 4vw, 58px);
        right: clamp(28px, 3vw, 44px);
        bottom: clamp(24px, 3vh, 30px);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 40px;
      }
      .planet-content h1 {
        font-family: Aalto, 'Arial Narrow', sans-serif;
        font-size: clamp(128px, 21.8vw, 314px);
        font-weight: 400;
        line-height: .72;
        margin: 0 0 -.04em;
        letter-spacing: 0;
        transform: translateX(-32px);
        opacity: 0;
        white-space: nowrap;
        user-select: none;
      }
      .planet-content dl {
        width: min(447px, 34vw);
        margin: 0;
        font-size: 16px;
      }
      .fact {
        display: grid;
        grid-template-columns: 138px 1fr;
        gap: 18px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, .48);
        opacity: 0;
      }
      .fact:last-child {
        border-bottom: 0;
      }
      .fact dt {
        font-weight: 700;
      }
      .fact dd {
        margin: 0;
        color: rgba(255, 255, 255, .9);
      }

      /* MISC */
      .transition-layer {
        display: none;
      }
      .scene-canvas {
        display: none;
      }
      .loading {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        opacity: 0;
        font-size: 12px;
        letter-spacing: .14em;
        text-transform: uppercase;
        transition: opacity .2s;
        pointer-events: none;
        font-weight: 600;
      }
      .experience.is-loading .loading {
        opacity: .8;
      }
      .experience.is-transitioning .header,
      .experience.is-transitioning .planet-list {
        opacity: 1;
        filter: none;
        pointer-events: auto;
      }
      .experience.is-transitioning .shade {
        opacity: 1;
      }
      .experience.is-committing .background {
        transition: none !important;
      }

      /* PRELOADER */
      .preloader {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        overflow: hidden;
      }
      .preloader video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preloader-shade {
        position: absolute;
        inset: auto 0 0;
        height: 35%;
        background: linear-gradient(to bottom, transparent, #000);
      }
      .preloader.is-background {
        z-index: 0;
      }
      .preloader.is-background .preloader-shade {
        opacity: 0;
      }
      .floating-logo {
        position: fixed;
        z-index: 22;
        left: 50%;
        top: 50%;
        width: 59px;
        height: 58px;
        transform: translate(-50%, -50%);
        will-change: left, top, width, height, transform;
        transition: left 2s cubic-bezier(.16, 1, .3, 1),
                    top 2s cubic-bezier(.16, 1, .3, 1),
                    width 2s cubic-bezier(.16, 1, .3, 1),
                    height 2s cubic-bezier(.16, 1, .3, 1),
                    transform 2s cubic-bezier(.16, 1, .3, 1);
        pointer-events: none;
      }
      .floating-logo.is-docked {
        left: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        width: 37px;
        height: 36px;
        transform: none;
      }
      .floating-logo.is-settled {
        z-index: 5;
      }
      .preloader-count {
        position: fixed;
        z-index: 22;
        left: 50%;
        bottom: clamp(22px, 3.1vh, 28px);
        display: flex;
        align-items: flex-end;
        gap: 4px;
        transform: translateX(-50%);
        font-family: 'SF Pro', Arial, sans-serif;
        line-height: 1;
        pointer-events: none;
      }
      .preloader-count > span:first-child {
        font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
        font-size: 64px;
        font-weight: 100;
      }
      .preloader-count .percent {
        font-size: 24px;
        padding-bottom: 4px;
      }
      .preloader-count.is-leaving {
        animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
      }
      @keyframes preload-count-out {
        to {
          opacity: 0;
          filter: blur(7px);
          transform: translate(-50%, -34px);
        }
      }
      body:not(.preload-complete) .custom-cursor {
        opacity: 0 !important;
      }

      /* CUSTOM CURSOR */
      html, body, button, a, .portal {
        cursor: none !important;
      }
      .custom-cursor {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity .2s ease;
        will-change: transform;
      }
      .custom-cursor.is-visible {
        opacity: 1;
      }
      .cursor-dot, .cursor-orbit {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .cursor-dot {
        width: 12px;
        height: 12px;
        background: #fff;
        pointer-events: none;
      }
      .cursor-orbit {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: rgba(255, 255, 255, .4);
        transition: transform .3s cubic-bezier(.22, 1, .36, 1);
        pointer-events: none;
      }
      .custom-cursor.is-enter .cursor-orbit {
        transform: translate(-50%, -50%) scale(1.16);
      }
      .cursor-label {
        position: absolute;
        top: 26px;
        left: 0;
        transform: translateX(-50%) translateY(-4px);
        font: 16px/1.2 'SF Pro', Arial, sans-serif;
        white-space: nowrap;
        opacity: 0;
        transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
        pointer-events: none;
        color: #fff;
      }
      .custom-cursor.is-enter .cursor-label {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ENTRANCE / SWITCH ANIMATIONS */
      body:not(.intro-ready) .header,
      body:not(.intro-ready) .planet-list,
      body:not(.intro-ready) .planet-content h1,
      body:not(.intro-ready) .planet-content .fact {
        opacity: 0;
      }
      .intro-ready .header {
        animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both;
      }
      .intro-ready .planet-list {
        animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both;
      }
      .content-revealing h1 {
        animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both;
      }
      .content-revealing .fact {
        animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both;
      }
      .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
      .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
      .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
      .content-revealing .fact:nth-child(4) { animation-delay: 1s; }

      .mask-revealing .portal-heading {
        animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both;
      }
      .planet-list.is-switching .planet-item {
        animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both;
      }
      .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
      .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
      .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
      .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
      .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
      .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
      .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .20s; }
      .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }
      .planet-list.is-switching .planet-item.active:before {
        animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both;
      }

      @keyframes reveal-down {
        from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes reveal-side {
        from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
        to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
      }
      @keyframes title-rise {
        from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
        to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
      }
      @keyframes fact-rise {
        from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes portal-caption {
        from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes menu-row {
        from { opacity: .35; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes active-dot {
        from { opacity: 0; transform: scale(0); }
        to { opacity: 1; transform: scale(1); }
      }

      /* RESPONSIVE */
      @media (max-width: 900px) {
        .nav { display: none; }
        .portal-wrap { width: min(300px, 48vw); }
        .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
        .planet-content dl { width: 43vw; }
        .fact { grid-template-columns: 110px 1fr; }
        .planet-list { font-size: 14px; }
        .planet-item.active { font-size: 16px; }
      }
      @media (max-width: 640px) {
        .experience { min-height: 600px; }
        .planet-list { display: none; }
        .portal-wrap { top: 44%; width: min(260px, 66vw); }
        .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
        .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
        .planet-content dl { width: 100%; font-size: 13px; }
        .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
        .portal-heading { font-size: 14px; }
        .portal-heading strong { font-size: 16px; }
        .menu { height: 38px; }
        .portal { border-radius: 70px; }
      }
      @media (hover: none) and (pointer: coarse) {
        html, body, button, a, .portal { cursor: auto !important; }
        .custom-cursor { display: none !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: .01ms !important; }
        .portal { transform: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="experience" data-planet="mars">
      <div class="backgrounds" aria-hidden="true">
        <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
        <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
        <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
      </div>
      <div class="preloader" id="preloader" aria-label="Loading Mars">
        <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
        <div class="preloader-shade"></div>
      </div>
      <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural">
      <div class="preloader-count" id="preloader-count" aria-live="polite">
        <span id="preloader-value">0</span><span class="percent">%</span>
      </div>
      <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>

      <header class="header chrome">
        <div class="header-actions">
          <nav class="nav" aria-label="Primary navigation">
            <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
          </nav>
          <button class="menu" type="button">Menu</button>
        </div>
      </header>

      <aside class="planet-list chrome" aria-label="Planets"></aside>   <!-- JS-filled -->

      <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
      <section class="portal-wrap chrome" aria-label="Next destination">
        <div class="portal-heading">
          <span>Next:</span>
          <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
        </div>
        <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
          <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
          <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
        </button>
      </section>

      <section class="planet-content chrome" aria-live="polite">
        <h1 id="planet-title">MARS</h1>
        <dl id="facts"></dl>                                           <!-- JS-filled -->
      </section>

      <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
      <div class="loading" aria-hidden="true">Preparing orbit…</div>
      <div class="custom-cursor" aria-hidden="true">
        <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
      </div>
    </main>

    <script>
      (function() {
        const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
        const MARS_BG  = BASE + '/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4';
        const TO_EARTH = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
        const TO_VENUS = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
        const TO_MARS  = BASE + '/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4';
        const MERCURY  = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';
        const LOGO     = BASE + '/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg';

        const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

        const states = {
          mars: {
            name: 'Mars',
            next: 'Earth',
            number: '[03]',
            portal: TO_EARTH,
            background: 'mars-background',
            facts: [
              ['Distance:', 'About 228 million km (1.5 astronomical units).'],
              ['Year:', 'One Martian year is equal to 687 Earth days.'],
              ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
              ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
            ]
          },
          earth: {
            name: 'Earth',
            next: 'Venus',
            number: '[02]',
            portal: TO_VENUS,
            background: 'earth-background',
            facts: [
              ['Distance:', '149.6 million km from the Sun.'],
              ['Year:', '365.25 Earth days.'],
              ['Temperature:', 'Average surface temperature around 15 °C.'],
              ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
            ]
          },
          venus: {
            name: 'Venus',
            next: 'Mercury',
            number: '[06]',
            image: MERCURY,
            background: 'venus-background',
            facts: [
              ['Distance:', '108.2 million km from the Sun.'],
              ['Year:', '225 Earth days.'],
              ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
              ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
            ]
          }
        };

        let current = 'mars';
        let busy = false;
        let preloaderDone = false;
        let renderCount = 0;

        let expansion = 0;
        let maskScale = 0;
        let canvasOpacity = 1;
        let transitionActive = false;
        let frozenSceneExists = false;
        let frozenFrameHeld = false;

        let targetX = 0, targetY = 0;
        let rotX = 0, rotY = 0;

        let mouseX = -200, mouseY = -200;
        let orbitX = -200, orbitY = -200;
        let cursorVisible = false;

        const experienceEl = document.querySelector('.experience');
        const preloaderEl = document.getElementById('preloader');
        const preloaderVideo = document.getElementById('preloader-video');
        const preloaderCountEl = document.getElementById('preloader-count');
        const preloaderValEl = document.getElementById('preloader-value');
        const floatingLogoEl = document.getElementById('floating-logo');

        const portalCanvas = document.getElementById('portal-canvas');
        const portalCtx = portalCanvas.getContext('2d');
        const sceneCanvas = document.getElementById('scene-canvas');
        const sceneCtx = sceneCanvas.getContext('2d');

        const portalBtn = document.getElementById('portal');
        const portalVideo = document.getElementById('portal-video');
        const portalImage = document.getElementById('portal-image');
        const transitionVideo = document.getElementById('transition-video');

        const customCursorEl = document.querySelector('.custom-cursor');
        const cursorDotEl = document.querySelector('.cursor-dot');
        const cursorOrbitEl = document.querySelector('.cursor-orbit');

        function resizeCanvas() {
          const d = Math.min(window.devicePixelRatio || 1, 2);
          portalCanvas.width = window.innerWidth * d;
          portalCanvas.height = window.innerHeight * d;
          portalCanvas.style.width = window.innerWidth + 'px';
          portalCanvas.style.height = window.innerHeight + 'px';
          portalCtx.setTransform(d, 0, 0, d, 0, 0);

          if (!frozenFrameHeld) {
            sceneCanvas.width = window.innerWidth * d;
            sceneCanvas.height = window.innerHeight * d;
            sceneCanvas.style.width = window.innerWidth + 'px';
            sceneCanvas.style.height = window.innerHeight + 'px';
            sceneCtx.setTransform(d, 0, 0, d, 0, 0);
          }
        }
        window.addEventListener('resize', resizeCanvas);

        function drawCover(media, targetCtx) {
          if (!media) return;
          const mw = media.videoWidth || media.naturalWidth || media.width;
          const mh = media.videoHeight || media.naturalHeight || media.height;
          if (!mw || !mh) return;
          const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
          const w = mw * scale;
          const h = mh * scale;
          const x = (window.innerWidth - w) / 2;
          const y = (window.innerHeight - h) / 2;
          targetCtx.drawImage(media, x, y, w, h);
        }

        function drawShade(targetCtx) {
          const startY = window.innerHeight * 0.52;
          const grad = targetCtx.createLinearGradient(0, startY, 0, window.innerHeight);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          grad.addColorStop(1, 'rgba(0,0,0,0.88)');
          targetCtx.fillStyle = grad;
          targetCtx.fillRect(0, startY, window.innerWidth, window.innerHeight - startY);
        }

        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animateValue(setter, duration) {
          return new Promise(resolve => {
            const start = performance.now();
            function frame(now) {
              const elapsed = now - start;
              const progress = Math.min(1, elapsed / duration);
              const eased = easeInOutCubic(progress);
              setter(eased);
              if (progress < 1) {
                requestAnimationFrame(frame);
              } else {
                resolve();
              }
            }
            requestAnimationFrame(frame);
          });
        }

        function getRoundedRectPoints(w, h, r) {
          r = Math.max(0, Math.min(r, w / 2, h / 2));
          const corners = [
            [ w / 2 - r, -h / 2 + r, -Math.PI / 2, 0 ],
            [ w / 2 - r,  h / 2 - r, 0, Math.PI / 2 ],
            [-w / 2 + r,  h / 2 - r, Math.PI / 2, Math.PI ],
            [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5 ]
          ];
          const points = [];
          const steps = 10;
          for (let c = 0; c < 4; c++) {
            const [cx, cy, startA, endA] = corners[c];
            for (let i = 0; i <= steps; i++) {
              const a = startA + (endA - startA) * (i / steps);
              points.push({
                x: cx + Math.cos(a) * r,
                y: cy + Math.sin(a) * r
              });
            }
          }
          return points;
        }

        function render() {
          const state = states[current];

          experienceEl.dataset.planet = current;
          document.getElementById('planet-title').textContent = state.name.toUpperCase();
          document.getElementById('next-name').textContent = state.next;
          document.getElementById('next-number').textContent = state.number;
          portalBtn.setAttribute('aria-label', 'Travel to ' + state.next);

          const factsContainer = document.getElementById('facts');
          factsContainer.innerHTML = state.facts.map(([k, v]) =>
            '<div class="fact"><dt>' + k + '</dt><dd>' + v + '</dd></div>'
          ).join('');

          const planetListEl = document.querySelector('.planet-list');
          planetListEl.innerHTML = planets.map(p =>
            '<span class="planet-item' + (p.toLowerCase() === state.name.toLowerCase() ? ' active' : '') + '">' + p + '</span>'
          ).join('');

          if (renderCount > 0) {
            planetListEl.classList.remove('is-switching');
            void planetListEl.offsetWidth; // force reflow
            planetListEl.classList.add('is-switching');
          }
          renderCount++;

          const bgVideos = document.querySelectorAll('.background');
          bgVideos.forEach(bg => {
            if (bg.id === state.background) {
              bg.classList.add('is-visible');
              bg.loop = true;
              bg.play().catch(() => {});
            } else {
              bg.classList.remove('is-visible');
              bg.pause();
            }
          });

          if (state.image) {
            portalImage.style.display = 'block';
            portalVideo.style.display = 'none';
            portalVideo.pause();
          } else {
            portalImage.style.display = 'none';
            portalVideo.style.display = 'block';
            if (portalVideo.src !== state.portal) {
              portalVideo.src = state.portal;
              portalVideo.load();
            }
            portalVideo.loop = true;
            portalVideo.play().catch(() => {});
          }
        }

        function revealMask() {
          experienceEl.classList.remove('mask-revealing');
          void experienceEl.offsetWidth;
          experienceEl.classList.add('mask-revealing');
          maskScale = 0;
          return animateValue(v => { maskScale = v; }, 1050);
        }

        function revealPlanetContent() {
          experienceEl.classList.remove('content-revealing');
          void experienceEl.offsetWidth;
          experienceEl.classList.add('content-revealing');
        }

        function waitForMedia(media) {
          return new Promise(resolve => {
            if (!media) return resolve();
            if (media instanceof HTMLImageElement) {
              if (media.complete && media.naturalWidth > 0) return resolve();
              media.onload = () => resolve();
              media.onerror = () => resolve();
            } else if (media instanceof HTMLVideoElement) {
              if (media.readyState >= 2) return resolve();
              const onReady = () => {
                media.removeEventListener('loadeddata', onReady);
                media.removeEventListener('canplay', onReady);
                media.removeEventListener('error', onReady);
                resolve();
              };
              media.addEventListener('loadeddata', onReady, { once: true });
              media.addEventListener('canplay', onReady, { once: true });
              media.addEventListener('error', onReady, { once: true });
              setTimeout(resolve, 2000);
            } else {
              resolve();
            }
          });
        }

        async function startExperience() {
          const currentPortalMedia = states[current].image ? portalImage : portalVideo;
          await waitForMedia(currentPortalMedia);

          if (!states[current].image) {
            portalVideo.loop = true;
            portalVideo.play().catch(() => {});
          }
          const bg = document.getElementById(states[current].background);
          if (bg) {
            bg.loop = true;
            bg.play().catch(() => {});
          }

          await revealMask();
          document.body.classList.add('intro-ready');
          setTimeout(() => {
            revealPlanetContent();
          }, 850);
        }

        function finishPreloader() {
          if (preloaderDone) return;
          preloaderDone = true;
          preloaderValEl.textContent = '100';
          preloaderCountEl.classList.add('is-leaving');
          floatingLogoEl.classList.add('is-docked');
          preloaderEl.classList.add('is-background');
          document.body.classList.add('preload-complete');

          startExperience();

          setTimeout(() => {
            if (preloaderCountEl && preloaderCountEl.parentNode) {
              preloaderCountEl.parentNode.removeChild(preloaderCountEl);
            }
          }, 750);

          setTimeout(() => {
            floatingLogoEl.classList.add('is-settled');
          }, 2000);
        }

        function runPreloader() {
          let started = false;

          function startPlayback() {
            if (started) return;
            started = true;
            const dur = (preloaderVideo.duration && !isNaN(preloaderVideo.duration)) ? preloaderVideo.duration : 3;
            preloaderVideo.playbackRate = Math.max(0.25, dur / 3);

            const p = preloaderVideo.play();
            if (p !== undefined) {
              p.catch(() => {
                finishPreloader();
              });
            }

            function updateProgress() {
              if (preloaderDone) return;
              if (preloaderVideo.duration) {
                const pct = Math.min(100, Math.max(0, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100)));
                preloaderValEl.textContent = String(pct);
              }
              requestAnimationFrame(updateProgress);
            }
            requestAnimationFrame(updateProgress);
          }

          preloaderVideo.addEventListener('ended', finishPreloader, { once: true });
          preloaderVideo.addEventListener('error', finishPreloader, { once: true });

          if (preloaderVideo.readyState >= 1) {
            startPlayback();
          } else {
            preloaderVideo.addEventListener('loadedmetadata', startPlayback, { once: true });
          }

          setTimeout(() => {
            if (!preloaderDone) finishPreloader();
          }, 4500);
        }

        async function travel() {
          if (busy || current === 'venus') return;
          busy = true;
          targetX = 0;
          targetY = 0;

          const next = current === 'mars' ? 'earth' : 'venus';

          try {
            transitionVideo.src = states[current].portal;
            transitionVideo.load();
            experienceEl.classList.add('is-loading');

            await new Promise(resolve => {
              let resolved = false;
              const cleanup = () => {
                if (resolved) return;
                resolved = true;
                transitionVideo.removeEventListener('canplaythrough', onReady);
                transitionVideo.removeEventListener('error', onReady);
                resolve();
              };
              const onReady = () => cleanup();
              transitionVideo.addEventListener('canplaythrough', onReady, { once: true });
              transitionVideo.addEventListener('error', onReady, { once: true });
              setTimeout(cleanup, 1600);
            });

            experienceEl.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
            experienceEl.classList.add('is-transitioning');

            transitionVideo.currentTime = 0;
            transitionVideo.playbackRate = 1.3;
            canvasOpacity = 1;
            transitionActive = true;
            await transitionVideo.play();

            await animateValue(v => { expansion = v; }, 1100);

            await new Promise(resolve => {
              if (transitionVideo.ended) return resolve();
              transitionVideo.addEventListener('ended', resolve, { once: true });
              const safetyMs = transitionVideo.duration ? (transitionVideo.duration / 1.3) * 1000 + 1000 : 7000;
              setTimeout(resolve, safetyMs);
            });

            // freeze its final frame into #scene-canvas (clear, drawCover into that context)
            frozenSceneExists = true;
            frozenFrameHeld = true;
            sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            drawCover(transitionVideo, sceneCtx);

            current = next;
            experienceEl.classList.add('is-committing');
            render();

            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

            transitionActive = false;
            expansion = 0;
            maskScale = 0;
            canvasOpacity = 1;
            experienceEl.classList.remove('is-transitioning', 'is-committing');

            const maskReveal = revealMask();
            setTimeout(() => {
              revealPlanetContent();
            }, 100);
            await maskReveal;

            setTimeout(() => {
              transitionVideo.removeAttribute('src');
              transitionVideo.load();
              frozenSceneExists = false;
              frozenFrameHeld = false;
              sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
              busy = false;
            }, 450);

          } catch (err) {
            console.error('Travel transition error:', err);
            transitionActive = false;
            expansion = 0;
            maskScale = 1;
            canvasOpacity = 1;
            frozenSceneExists = false;
            frozenFrameHeld = false;
            experienceEl.classList.remove('is-loading', 'is-transitioning', 'is-committing');
            busy = false;
          }
        }

        // Pointer tilt tracking
        window.addEventListener('pointermove', e => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (!cursorVisible) {
            cursorVisible = true;
            orbitX = mouseX;
            orbitY = mouseY;
            customCursorEl.classList.add('is-visible');
          }

          if (busy) return;
          targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
          targetX = (e.clientY / window.innerHeight - 0.5) * -33;
        });

        window.addEventListener('pointerleave', () => {
          if (busy) return;
          targetX = 0;
          targetY = 0;
        });

        document.addEventListener('mouseleave', () => {
          customCursorEl.classList.remove('is-visible');
          cursorVisible = false;
        });

        portalBtn.addEventListener('pointerenter', () => {
          if (current !== 'venus') {
            customCursorEl.classList.add('is-enter');
          }
        });

        portalBtn.addEventListener('pointerleave', () => {
          customCursorEl.classList.remove('is-enter');
        });

        portalBtn.addEventListener('click', () => {
          travel();
        });

        // Navigation links
        document.querySelectorAll('.nav a').forEach(a => {
          a.addEventListener('click', e => {
            e.preventDefault();
            document.querySelectorAll('.nav a').forEach(el => el.classList.remove('active'));
            a.classList.add('active');
          });
        });

        let lastTime = performance.now();

        function draw(now) {
          const delta = now - lastTime;
          lastTime = now;
          const dt = Math.min(delta, 40);

          if (!busy) {
            rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
            rotY += (targetY - rotY) * Math.min(1, dt * 0.009);
          }

          portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          if (frozenSceneExists) {
            portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
            drawShade(portalCtx);
          }

          const rect = portalBtn.getBoundingClientRect();
          const rectCx = rect.left + rect.width / 2;
          const rectCy = rect.top + rect.height / 2;

          const e = expansion;
          const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
          const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
          const baseW = rect.width + (window.innerWidth - rect.width) * e;
          const baseH = rect.height + (window.innerHeight - rect.height) * e;
          const scale = e ? 1 : maskScale;
          const w = baseW * scale;
          const h = baseH * scale;
          const r = 90 * (1 - e) * scale;
          const rx = rotX * (1 - e);
          const ry = rotY * (1 - e);

          if (w > 1 && h > 1) {
            const points = getRoundedRectPoints(w, h, r);
            const ax = rx * Math.PI / 180;
            const ay = ry * Math.PI / 180;
            const cosAy = Math.cos(ay);
            const sinAy = Math.sin(ay);
            const cosAx = Math.cos(ax);
            const sinAx = Math.sin(ax);

            portalCtx.save();
            portalCtx.globalAlpha = canvasOpacity;
            portalCtx.beginPath();
            for (let i = 0; i < points.length; i++) {
              const pt = points[i];
              const xx = pt.x * cosAy;
              const yy = pt.y * cosAx;
              const z = pt.x * sinAy - pt.y * sinAx;
              const p = 850 / (850 + z);
              const sx = cx + xx * p;
              const sy = cy + yy * p;
              if (i === 0) {
                portalCtx.moveTo(sx, sy);
              } else {
                portalCtx.lineTo(sx, sy);
              }
            }
            portalCtx.closePath();
            portalCtx.clip();

            portalCtx.fillStyle = '#030303';
            portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            const state = states[current];
            const mediaSource = transitionActive ? transitionVideo : (state.image ? portalImage : portalVideo);
            drawCover(mediaSource, portalCtx);

            if (transitionActive) {
              drawShade(portalCtx);
            }

            portalCtx.restore();
          }

          requestAnimationFrame(draw);
        }

        function cursorLoop() {
          orbitX += (mouseX - orbitX) * 0.2;
          orbitY += (mouseY - orbitY) * 0.2;

          customCursorEl.style.transform = 'translate3d(' + orbitX + 'px, ' + orbitY + 'px, 0)';
          cursorDotEl.style.transform = 'translate3d(' + (mouseX - orbitX) + 'px, ' + (mouseY - orbitY) + 'px, 0) translate(-50%, -50%)';

          requestAnimationFrame(cursorLoop);
        }

        // Section 12: Boot order
        document.querySelectorAll('.background').forEach(bg => {
          bg.pause();
          bg.currentTime = 0;
        });
        resizeCanvas();
        render();
        requestAnimationFrame(draw);
        requestAnimationFrame(cursorLoop);
        runPreloader();

      })();
    </script>
  </body>
</html>
